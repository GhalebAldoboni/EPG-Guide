name: Update Arabic EPG

on:
  schedule:
    # Refresh the committed XML approximately every three hours while avoiding
    # the busy top of the hour. GitHub may delay scheduled jobs occasionally.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-arabic-epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Generate and validate Arabic EPG
        run: python update_epg.py

      - name: Commit changed guide
        run: |
          if git diff --quiet -- ArabicEPG.xml; then
            echo "Guide is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArabicEPG.xml
          git commit -m "chore: refresh Arabic EPG"
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
