name: Update Arabic EPG

on:
  push:
    branches: [master]
    paths:
      - ".github/workflows/update-arabic-epg.yml"
      - "channel_aliases.json"
      - "epg_generator.py"
      - "requirements-test.txt"
      - "tests/**"
      - "update_epg.py"
  schedule:
    # Refresh the committed XML approximately every three hours while avoiding
    # the busy top of the hour. GitHub may delay scheduled jobs occasionally.
    - cron: "17 */3 * * *"
  workflow_dispatch:

concurrency:
  group: update-arabic-epg
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --require-hashes -r requirements-test.txt

      - name: Run tests
        run: python -m pytest -q tests

      - name: Generate and validate Arabic EPG
        run: python update_epg.py
        env:
          # elCinema currently localizes GitHub-hosted runner requests to US Eastern.
          # ZoneInfo keeps the Dubai correction accurate across DST changes.
          ELCINEMA_SOURCE_TIMEZONE: America/New_York

      - name: Commit changed guide
        run: |
          if git diff --quiet -- ArabicEPG.xml; then
            echo "Guide is unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ArabicEPG.xml
          git commit -m "chore: refresh Arabic EPG"
          git fetch "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "${GITHUB_REF_NAME}"
          git rebase FETCH_HEAD
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ github.token }}
